{% extends "base.html" %}
{% block content %}

<h2>Offene Urlaubsanträge</h2>

<table border="1" cellpadding="5">
<tr>
    <th>User</th>
    <th>Von</th>
    <th>Bis</th>
    <th>Aktion</th>
</tr>

{% for u in offene %}
<tr>
    <td>{{ u.user }}</td>
    <td>{{ u.startdatum }}</td>
    <td>{{ u.enddatum }}</td>
    <td>
        <form method="post" style="display:inline;">
            {% csrf_token %}
            <input type="hidden" name="id" value="{{ u.id }}">

            <button name="aktion" value="approve">Genehmigen</button>
            <button name="aktion" value="reject">Ablehnen</button>
        </form>
    </td>
</tr>
{% endfor %}
</table>

{% endblock %}
